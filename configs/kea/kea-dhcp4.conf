{
   "Dhcp4": {
     "interfaces-config": {
       "interfaces": [ "enp2s0" ]
     },

     "control-socket": {
        "socket-type": "unix",
        "socket-name": "/run/kea/kea4-ctrl-socket"
     },

     "lease-database": {
       "type": "memfile",
       "persist": true,
       "name": "/var/lib/kea/kea-leases4.csv"
     },
     "option-data": [
        {
          "name": "domain-name-servers",
          "data": "192.168.1.66"
        },
        {
          "name": "domain-name",
          "data": "salar.com"
        }
     ],
     "subnet4": [
         {
           "id": 10,
           "subnet": "192.168.1.0/27",
           "pools": [ { "pool": "192.168.1.1 - 192.168.1.25" } ],
           "reservations": [
             {
               "hw-address": "0C:24:1C:BD:00:00",
               "ip-address": "192.168.1.2"
             },
             {
               "hw-address": "0C:03:A2:62:00:00",
               "ip-address": "192.168.1.3"
             }
             ],
           "option-data": [
              {
                "name": "routers",
                "data": "192.168.1.30"
              }
           ]
         },
          {
           "id": 40,
           "subnet": "192.168.1.96/27",
           "pools": [ { "pool": "192.168.1.98 - 192.168.1.120" } ],
           "option-data": [
              {
                "name": "routers",
                "data": "192.168.1.97"
              }
           ]
         },
         {
           "id": 20,
           "subnet": "192.168.1.32/27",
           "pools": [ { "pool": "192.168.1.33 - 192.168.1.57" } ],
           "option-data": [
              {
                "name": "routers",
                "data": "192.168.1.62"
              }
           ]
         }
     ],
     "hooks-libraries": [
        {
          "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so"
        },
        {
          "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so",
          "parameters": {
             "high-availability": [
               {
                 "this-server-name": "server1",
                 "mode": "hot-standby",
                 "heartbeat-delay": 1000,
                 "max-response-delay": 6000,
                 "max-ack-delay": 10000,
                 "max-unacked-clients": 0,
                 "peers": [
                   {
                     "name": "server1",
                     "url": "http://192.168.1.66:8000/",
                     "role": "primary"
                   },
                   {
                     "name": "server2",
                     "url": "http://192.168.1.67:8000/",
                     "role": "standby"
                   }
                 ]
                }
             ]
          }
        }
     ] 
   }
}
