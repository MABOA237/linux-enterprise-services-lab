# Global parameters
[global]
	dns forwarder = 1.1.1.1 8.8.8.8
	netbios name = MEJJ
	realm = SALAR.COM
	server role = active directory domain controller
	workgroup = SALAR
	idmap_ldb:use rfc2307 = yes

[sysvol]
	path = /var/lib/samba/sysvol
	read only = No

[netlogon]
	path = /var/lib/samba/sysvol/salar.com/scripts
	read only = No
